# ═══════════════════════════════════════════════════════
# CareNest Backend - Cấu hình chính
# ═══════════════════════════════════════════════════════
# Profile mặc định: dev
# Chạy với profile khác: --spring.profiles.active=prod
# ═══════════════════════════════════════════════════════

spring:
  application:
    name: carenest-backend

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

  # Profile mặc định khi chạy local
  profiles:
    active: dev

  ai:
    vertex:
      ai:
        gemini:
          enabled: false

  # ── PostgreSQL ──────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/carenest_db}
    username: ${SPRING_DATASOURCE_USERNAME:carenest_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA / Hibernate ─────────────────────────────────
  jpa:
    open-in-view: false           # Best practice: tắt lazy loading ngoài transaction
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis ───────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

  # ── Mail (Gmail SMTP) ──────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# ── JWT Custom Properties ───────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:carenest-256-bit-secret-key-for-dev-environment-only-change-in-prod}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}       # 15 phút (ms)
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 ngày (ms)
  features:
    ai-chat-enabled: ${APP_FEATURE_AI_CHAT_ENABLED:false}
    ocr-enabled: ${APP_FEATURE_OCR_ENABLED:false}

# ── Server ──────────────────────────────────────────
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads/media}
    max-image-size-bytes: ${MEDIA_MAX_IMAGE_SIZE_BYTES:5242880}

server:
  port: 8080
  servlet:
    context-path: /api/v1
