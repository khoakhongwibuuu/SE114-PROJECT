spring:
  application:
    name: carenest-backend

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB

  profiles:
    active: dev

  ai:
    vertex:
      ai:
        gemini:
          enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/carenest_db}
    username: ${SPRING_DATASOURCE_USERNAME:carenest_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:carenest-256-bit-secret-key-for-dev-environment-only-change-in-prod}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  features:
    ai-chat-enabled: ${APP_FEATURE_AI_CHAT_ENABLED:false}
    ocr-enabled: ${APP_FEATURE_OCR_ENABLED:false}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_MODEL_CHAT:}
    ocr-model: ${AI_MODEL_OCR:}
    timeout-ms: ${AI_TIMEOUT_MS:15000}
    max-retries: ${AI_MAX_RETRIES:2}
  ocr:
    enabled: ${OCR_ENABLED:false}
  media:
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads/media}
    max-image-size-bytes: ${MEDIA_MAX_IMAGE_SIZE_BYTES:5242880}
  seed:
    qa-demo:
      enabled: ${APP_SEED_QA_DEMO_ENABLED:false}
      default-password: ${APP_SEED_QA_DEMO_DEFAULT_PASSWORD:}
      admin-email: ${APP_SEED_QA_DEMO_ADMIN_EMAIL:admin.demo@carenest.local}
      patient-primary-email: ${APP_SEED_QA_DEMO_PATIENT_PRIMARY_EMAIL:patient.one.demo@carenest.local}
      patient-secondary-email: ${APP_SEED_QA_DEMO_PATIENT_SECONDARY_EMAIL:patient.two.demo@carenest.local}
      doctor-pediatric-email: ${APP_SEED_QA_DEMO_DOCTOR_PEDIATRIC_EMAIL:doctor.pediatrics.demo@carenest.local}
      doctor-general-email: ${APP_SEED_QA_DEMO_DOCTOR_GENERAL_EMAIL:doctor.general.demo@carenest.local}
      moderator-email: ${APP_SEED_QA_DEMO_MODERATOR_EMAIL:moderator.demo@carenest.local}
      admin-full-name: ${APP_SEED_QA_DEMO_ADMIN_FULL_NAME:Demo Admin}
      patient-primary-full-name: ${APP_SEED_QA_DEMO_PATIENT_PRIMARY_FULL_NAME:Demo Patient One}
      patient-secondary-full-name: ${APP_SEED_QA_DEMO_PATIENT_SECONDARY_FULL_NAME:Demo Patient Two}
      doctor-pediatric-full-name: ${APP_SEED_QA_DEMO_DOCTOR_PEDIATRIC_FULL_NAME:Demo Pediatric Doctor}
      doctor-general-full-name: ${APP_SEED_QA_DEMO_DOCTOR_GENERAL_FULL_NAME:Demo General Doctor}
      moderator-full-name: ${APP_SEED_QA_DEMO_MODERATOR_FULL_NAME:Demo Moderator}

server:
  port: 8080
  servlet:
    context-path: /api/v1
